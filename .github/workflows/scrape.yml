name: Scrape Museum Pass Availability

on:
  schedule:
    # Runs automatically every morning at 5:00 AM UTC (1:00 AM EDT / 12:00 AM EST)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      months_to_scrape:
        description: 'Number of months to scrape'
        required: false
        default: '3'

# Grant contents:write permission so the action can push updated availability.json data
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Scraper
        env:
          HEADLESS: '1'
          MONTHS_TO_SCRAPE: ${{ github.event.inputs.months_to_scrape || '3' }}
        run: node scraper/scrape.js

      - name: Commit and push generated availability data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/availability.json
          git status
          git diff-index --quiet HEAD || git commit -m "auto: update museum pass availability data"
          git push
