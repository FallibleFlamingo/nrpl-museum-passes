<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRPL Museum Pass Availability Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for reactive UI -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col relative" x-data="museumDashboard()">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 md:py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-xl md:text-2xl font-bold">Museum Pass Availability Hub</h1>
                <p class="text-indigo-200 text-xs md:text-sm">Find and reserve available library museum passes easily.</p>
            </div>
            
            <div class="flex items-center gap-2 md:gap-3 w-full md:w-auto justify-center">
                <!-- Toggle Filter Sidebar Button -->
                <button @click="showSidebar = !showSidebar" 
                        class="px-3 py-2 bg-indigo-500 hover:bg-indigo-400 text-white rounded-lg text-xs md:text-sm font-medium transition flex items-center gap-1.5 shadow-sm">
                    <span x-text="showSidebar ? '◀ Hide Filters' : '⚙ Filters'"></span>
                </button>

                <!-- View Switcher Tabs -->
                <div class="bg-indigo-700 p-1 rounded-lg flex space-x-1">
                    <button @click="currentView = 'calendar'" 
                            :class="currentView === 'calendar' ? 'bg-white text-indigo-700 font-semibold shadow' : 'text-indigo-100 hover:text-white'"
                            class="px-3 py-1.5 md:px-4 md:py-2 rounded-md text-xs md:text-sm transition">
                        📅 <span class="hidden sm:inline">Month</span> View
                    </button>
                    <button @click="currentView = 'grid'" 
                            :class="currentView === 'grid' ? 'bg-white text-indigo-700 font-semibold shadow' : 'text-indigo-100 hover:text-white'"
                            class="px-3 py-1.5 md:px-4 md:py-2 rounded-md text-xs md:text-sm transition">
                        🎴 <span class="hidden sm:inline">Card Grid</span> View
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Collapsed Edge Tab Button (Desktop) -->
    <button x-show="!showSidebar" 
            @click="showSidebar = true" 
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 -translate-x-full"
            x-transition:enter-end="opacity-100 translate-x-0"
            class="hidden lg:flex fixed left-0 top-1/2 -translate-y-1/2 z-40 bg-indigo-600 hover:bg-indigo-700 text-white py-4 px-1.5 rounded-r-xl shadow-lg flex-col items-center gap-2 font-medium text-xs tracking-wider uppercase writing-mode-vertical transition">
        <span>⚙</span>
        <span>F</span><span>i</span><span>l</span><span>t</span><span>e</span><span>r</span><span>s</span>
    </button>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 md:py-8 flex-grow w-full flex flex-col lg:flex-row gap-6 md:gap-8">
        
        <!-- Sidebar Filters (Collapsible Drawer & Mobile Modal) -->
        <aside x-show="showSidebar" 
               x-transition:enter="transition ease-out duration-200"
               x-transition:enter-start="opacity-0 -translate-x-6"
               x-transition:enter-end="opacity-100 translate-x-0"
               class="bg-white p-5 md:p-6 rounded-xl shadow-sm border border-slate-200 w-full lg:w-80 shrink-0 space-y-5 h-fit">
            
            <!-- Sidebar Heading -->
            <div class="flex justify-between items-center border-b pb-3 border-slate-100">
                <div class="flex items-center gap-2">
                    <h2 class="font-bold text-lg text-slate-900">Filters</h2>
                    <button @click="showSidebar = false" 
                            title="Collapse filters"
                            class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-0.5 rounded font-medium transition">
                        Hide ◀
                    </button>
                </div>
                <button @click="resetFilters()" class="text-xs text-indigo-600 hover:underline font-medium">Reset All</button>
            </div>

            <!-- Search Filter -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Search Museum</label>
                <input type="text" x-model="searchQuery" placeholder="Filter by name..." class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- Section 1: Themes Accordion -->
            <div class="border-t pt-3 border-slate-100" x-data="{ open: true }">
                <button @click="open = !open" class="w-full flex justify-between items-center text-xs font-semibold uppercase tracking-wider text-slate-500 hover:text-slate-800 py-1">
                    <span>Themes</span>
                    <span x-text="open ? '−' : '+'" class="text-base font-bold"></span>
                </button>
                <div x-show="open" class="mt-2 space-y-2 max-h-48 overflow-y-auto pr-1">
                    <template x-for="theme in availableThemes" :key="theme">
                        <label class="flex items-center text-sm text-slate-700 cursor-pointer hover:text-indigo-600 transition">
                            <input type="checkbox" :value="theme" x-model="selectedThemes" class="rounded text-indigo-600 focus:ring-indigo-500 mr-2">
                            <span x-text="theme"></span>
                        </label>
                    </template>
                </div>
            </div>

            <!-- Section 2: Location / Region Accordion -->
            <div class="border-t pt-3 border-slate-100" x-data="{ open: true }">
                <button @click="open = !open" class="w-full flex justify-between items-center text-xs font-semibold uppercase tracking-wider text-slate-500 hover:text-slate-800 py-1">
                    <span>Location / Region</span>
                    <span x-text="open ? '−' : '+'" class="text-base font-bold"></span>
                </button>
                <div x-show="open" class="mt-2 space-y-2">
                    <template x-for="loc in availableLocations" :key="loc">
                        <label class="flex items-center text-sm text-slate-700 cursor-pointer hover:text-indigo-600 transition">
                            <input type="checkbox" :value="loc" x-model="selectedLocations" class="rounded text-indigo-600 focus:ring-indigo-500 mr-2">
                            <span x-text="loc"></span>
                        </label>
                    </template>
                </div>
            </div>

            <!-- Section 3: Individual Museums Accordion -->
            <div class="border-t pt-3 border-slate-100" x-data="{ open: false }">
                <button @click="open = !open" class="w-full flex justify-between items-center text-xs font-semibold uppercase tracking-wider text-slate-500 hover:text-slate-800 py-1">
                    <span>Specific Museums</span>
                    <span x-text="open ? '−' : '+'" class="text-base font-bold"></span>
                </button>
                <div x-show="open" class="mt-2 space-y-2 max-h-52 overflow-y-auto pr-1">
                    <template x-for="museum in museums" :key="museum.id">
                        <label class="flex items-center text-sm text-slate-700 cursor-pointer hover:text-indigo-600 transition">
                            <input type="checkbox" :value="museum.name" x-model="selectedMuseumNames" class="rounded text-indigo-600 focus:ring-indigo-500 mr-2">
                            <span x-text="museum.name" class="truncate"></span>
                        </label>
                    </template>
                </div>
            </div>
        </aside>

        <!-- Content Area -->
        <section class="flex-grow space-y-6 w-full">
            
            <!-- LOADING STATE -->
            <div x-show="loading" class="text-center py-20 bg-white rounded-xl border border-slate-200">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
                <p class="text-slate-500 mt-2">Loading museum pass availability...</p>
            </div>

            <!-- VIEW 1: MONTHLY CALENDAR VIEW -->
            <div x-show="!loading && currentView === 'calendar'" class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-200">
                <!-- Calendar Header & Month Navigation -->
                <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                    <h2 class="text-lg md:text-xl font-bold text-slate-900" x-text="monthNames[calendarMonth] + ' ' + calendarYear"></h2>
                    <div class="flex space-x-2">
                        <button @click="changeMonth(-1)" class="px-3 py-1.5 border rounded-lg text-xs md:text-sm bg-white hover:bg-slate-100">&larr; Prev</button>
                        <button @click="goToCurrentMonth()" class="px-3 py-1.5 border rounded-lg text-xs md:text-sm bg-white hover:bg-slate-100">Today</button>
                        <button @click="changeMonth(1)" class="px-3 py-1.5 border rounded-lg text-xs md:text-sm bg-white hover:bg-slate-100">Next &rarr;</button>
                    </div>
                </div>

                <!-- DESKTOP 7-COLUMN GRID VIEW (Shown on md: and larger) -->
                <div class="hidden md:block">
                    <!-- Days of Week Header -->
                    <div class="grid grid-cols-7 gap-2 text-center font-semibold text-xs text-slate-400 uppercase mb-2">
                        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                    </div>

                    <!-- Calendar Grid Days -->
                    <div class="grid grid-cols-7 gap-2">
                        <template x-for="day in calendarDays">
                            <div :class="{
                                    'bg-slate-50 opacity-40': !day.isCurrentMonth,
                                    'bg-white border-slate-200': day.isCurrentMonth,
                                    'border-indigo-500 ring-1 ring-indigo-500': day.isToday
                                 }" 
                                 class="min-h-[120px] p-2 border rounded-lg flex flex-col justify-between overflow-hidden">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-bold" :class="day.isToday ? 'bg-indigo-600 text-white px-1.5 py-0.5 rounded-full' : 'text-slate-700'" x-text="day.dateNumber"></span>
                                </div>
                                <!-- Available Museums as direct links -->
                                <div class="space-y-1 overflow-y-auto max-h-[85px] mt-1">
                                    <template x-for="pass in getPassesForDate(day.dateString)" :key="pass.museumName">
                                        <a :href="pass.bookingUrl" target="_blank" 
                                           class="block text-[11px] bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 rounded px-1.5 py-0.5 truncate font-medium transition"
                                           :title="pass.museumName">
                                            <span x-text="pass.museumName"></span>
                                        </a>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- MOBILE AGENDA LIST VIEW (Shown on screens smaller than md) -->
                <div class="block md:hidden space-y-4">
                    <template x-for="day in calendarDays.filter(d => d.isCurrentMonth && getPassesForDate(d.dateString).length > 0)" :key="day.dateString">
                        <div class="border rounded-xl p-4 bg-white shadow-sm border-slate-200">
                            <div class="flex justify-between items-center pb-2 mb-3 border-b border-slate-100">
                                <span class="font-bold text-sm text-slate-800" x-text="formatDateLong(day.dateString)"></span>
                                <span class="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full" 
                                      x-text="getPassesForDate(day.dateString).length + ' Available'"></span>
                            </div>
                            
                            <div class="space-y-2">
                                <template x-for="pass in getPassesForDate(day.dateString)" :key="pass.museumName">
                                    <a :href="pass.bookingUrl" target="_blank" 
                                       class="flex justify-between items-center p-2.5 bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-lg transition text-slate-800">
                                        <span class="text-xs font-semibold text-indigo-900 pr-2" x-text="pass.museumName"></span>
                                        <span class="text-[10px] bg-indigo-600 text-white font-medium px-2 py-1 rounded shrink-0">Reserve &rarr;</span>
                                    </a>
                                </template>
                            </div>
                        </div>
                    </template>
                    <template x-if="calendarDays.filter(d => d.isCurrentMonth && getPassesForDate(d.dateString).length > 0).length === 0">
                        <div class="text-center py-8 text-slate-400 italic text-sm">
                            No pass availability found for this month matching your active filters.
                        </div>
                    </template>
                </div>

            </div>

            <!-- VIEW 2: CARD GRID VIEW -->
            <div x-show="!loading && currentView === 'grid'" 
                 class="grid grid-cols-1 gap-6"
                 :class="showSidebar ? 'md:grid-cols-2' : 'md:grid-cols-3'">
                <template x-for="museum in filteredMuseums" :key="museum.id">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between hover:border-indigo-200 transition">
                        <div>
                            <div class="flex justify-between items-start gap-2 mb-2">
                                <h3 class="font-bold text-lg text-slate-900" x-text="museum.name"></h3>
                                <div class="flex flex-wrap gap-1 justify-end">
                                    <template x-for="t in (museum.themes || [museum.theme || 'General'])" :key="t">
                                        <span class="text-[10px] px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-full font-medium" x-text="t"></span>
                                    </template>
                                </div>
                            </div>
                            <p class="text-xs text-slate-500 mb-4" x-text="museum.location || 'New York City'"></p>
                            
                            <!-- Available Dates preview list -->
                            <div class="mb-4">
                                <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Available Dates:</h4>
                                <div class="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto">
                                    <template x-for="slot in getAvailableDatesList(museum)" :key="slot.date">
                                        <a :href="slot.bookingUrl" target="_blank" class="text-xs bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 px-2 py-0.5 rounded font-medium transition" x-text="formatDateShort(slot.date)" :title="'Book ' + museum.name"></a>
                                    </template>
                                    <template x-if="getAvailableDatesList(museum).length === 0">
                                        <span class="text-xs text-slate-400 italic">No dates currently available</span>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <div class="pt-4 border-t border-slate-100 flex justify-between items-center">
                            <span class="text-xs text-slate-500" x-text="getAvailableDatesCount(museum) + ' slots open'"></span>
                            <a :href="museum.url" target="_blank" class="text-xs font-medium text-indigo-600 hover:underline">View Museum Page &rarr;</a>
                        </div>
                    </div>
                </template>
            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mb-12 lg:mb-0">
        <p>NRPL Museum Pass Hub &bull; Automatically updated via GitHub Actions</p>
    </footer>

    <!-- Mobile Floating Navigation / Filter Trigger -->
    <div class="lg:hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-40 bg-slate-900/90 backdrop-blur-md text-white px-4 py-2.5 rounded-full shadow-xl flex items-center gap-4 text-xs font-medium border border-slate-700">
        <button @click="showSidebar = !showSidebar" class="flex items-center gap-1.5 text-indigo-300 hover:text-white">
            <span>⚙</span>
            <span x-text="showSidebar ? 'Close Filters' : 'Filters'"></span>
        </button>
        <span class="text-slate-600">|</span>
        <button @click="changeMonth(-1)" class="hover:text-indigo-300">&larr; Prev</button>
        <span x-text="monthNames[calendarMonth].slice(0, 3)"></span>
        <button @click="changeMonth(1)" class="hover:text-indigo-300">Next &rarr;</button>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        function museumDashboard() {
            return {
                loading: true,
                showSidebar: true,
                currentView: 'calendar',
                museums: [],
                searchQuery: '',
                selectedThemes: [],
                selectedLocations: [],
                selectedMuseumNames: [],
                
                availableThemes: ['Art', 'Children\'s', 'History', 'Nature', 'Outdoors', 'Science'],
                availableLocations: ['Central Westchester County', 'Northern Westchester County', 'New York City', 'Connecticut'],
                
                calendarYear: new Date().getFullYear(),
                calendarMonth: new Date().getMonth(),
                monthNames: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],

                init() {
                    // Auto-collapse sidebar on small screens initially for better mobile presentation
                    if (window.innerWidth < 1024) {
                        this.showSidebar = false;
                    }
                    this.fetchData();
                },

                async fetchData() {
                    try {
                        const response = await fetch('./data/availability.json');
                        const data = await response.json();
                        this.museums = data.museums || [];
                    } catch (err) {
                        console.error('Failed to load availability.json:', err);
                    } finally {
                        this.loading = false;
                    }
                },

                get filteredMuseums() {
                    return this.museums.filter(m => {
                        const matchesSearch = this.searchQuery === '' || m.name.toLowerCase().includes(this.searchQuery.toLowerCase());
                        
                        const mThemes = m.themes || (m.theme ? [m.theme] : []);
                        const matchesTheme = this.selectedThemes.length === 0 || 
                            mThemes.some(t => this.selectedThemes.includes(t));
                        
                        const matchesLoc = this.selectedLocations.length === 0 || 
                            (m.location && this.selectedLocations.includes(m.location));
                            
                        const matchesName = this.selectedMuseumNames.length === 0 || 
                            this.selectedMuseumNames.includes(m.name);
                        
                        return matchesSearch && matchesTheme && matchesLoc && matchesName;
                    });
                },

                getPassesForDate(dateStr) {
                    let passes = [];
                    this.filteredMuseums.forEach(museum => {
                        if (museum.days && museum.days[dateStr] && museum.days[dateStr].available) {
                            passes.push({
                                museumName: museum.name,
                                bookingUrl: museum.days[dateStr].bookingUrl || museum.url
                            });
                        }
                    });
                    return passes;
                },

                getAvailableDatesCount(museum) {
                    if (!museum.days) return 0;
                    return Object.values(museum.days).filter(d => d.available).length;
                },

                getAvailableDatesList(museum) {
                    if (!museum.days) return [];
                    return Object.entries(museum.days)
                        .filter(([date, info]) => info.available)
                        .map(([date, info]) => ({ date, bookingUrl: info.bookingUrl || museum.url }));
                },

                get calendarDays() {
                    const year = this.calendarYear;
                    const month = this.calendarMonth;
                    const firstDayIndex = new Date(year, month, 1).getDay();
                    const totalDaysInMonth = new Date(year, month + 1, 0).getDate();
                    const prevMonthDays = new Date(year, month, 0).getDate();
                    
                    let days = [];
                    const todayStr = new Date().toISOString().split('T')[0];

                    for (let i = firstDayIndex - 1; i >= 0; i--) {
                        let dNum = prevMonthDays - i;
                        let dDate = new Date(year, month - 1, dNum);
                        days.push({
                            dateNumber: dNum,
                            dateString: this.formatDateString(dDate),
                            isCurrentMonth: false,
                            isToday: false
                        });
                    }

                    for (let i = 1; i <= totalDaysInMonth; i++) {
                        let dDate = new Date(year, month, i);
                        let dStr = this.formatDateString(dDate);
                        days.push({
                            dateNumber: i,
                            dateString: dStr,
                            isCurrentMonth: true,
                            isToday: (dStr === todayStr)
                        });
                    }

                    let remainingCells = 7 - (days.length % 7);
                    if (remainingCells < 7) {
                        for (let i = 1; i <= remainingCells; i++) {
                            let dDate = new Date(year, month + 1, i);
                            days.push({
                                dateNumber: i,
                                dateString: this.formatDateString(dDate),
                                isCurrentMonth: false,
                                isToday: false
                            });
                        }
                    }

                    return days;
                },

                formatDateString(date) {
                    let y = date.getFullYear();
                    let m = String(date.getMonth() + 1).padStart(2, '0');
                    let d = String(date.getDate()).padStart(2, '0');
                    return `${y}-${m}-${d}`;
                },

                formatDateShort(dateStr) {
                    try {
                        const [y, m, d] = dateStr.split('-');
                        const date = new Date(y, m - 1, d);
                        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    } catch (e) {
                        return dateStr;
                    }
                },

                formatDateLong(dateStr) {
                    try {
                        const [y, m, d] = dateStr.split('-');
                        const date = new Date(y, m - 1, d);
                        return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                    } catch (e) {
                        return dateStr;
                    }
                },

                changeMonth(direction) {
                    this.calendarMonth += direction;
                    if (this.calendarMonth > 11) {
                        this.calendarMonth = 0;
                        this.calendarYear++;
                    } else if (this.calendarMonth < 0) {
                        this.calendarMonth = 11;
                        this.calendarYear--;
                    }
                },

                goToCurrentMonth() {
                    const now = new Date();
                    this.calendarYear = now.getFullYear();
                    this.calendarMonth = now.getMonth();
                },

                resetFilters() {
                    this.searchQuery = '';
                    this.selectedThemes = [];
                    this.selectedLocations = [];
                    this.selectedMuseumNames = [];
                }
            }
        }
    </script>
</body>
</html>
